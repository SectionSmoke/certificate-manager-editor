<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="55%" stop-color="#0f2233"/>
      <stop offset="100%" stop-color="#132c40"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#c9962f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fd0c9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fd0c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fd0c9"/>
      <stop offset="100%" stop-color="#1f8f88"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#0d2033"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- faint security grid -->
  <g stroke="#3fd0c9" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="950" y1="0" x2="950" y2="360"/>
  </g>

  <circle cx="900" cy="180" r="220" fill="url(#glow)"/>

  <!-- decorative certificate seal cluster on right -->
  <g transform="translate(930,180)">
    <!-- outer shield -->
    <path d="M0,-140 L110,-95 L110,20 C110,110 55,160 0,190 C-55,160 -110,110 -110,20 L-110,-95 Z"
          fill="#0d2033" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
    <path d="M0,-115 L88,-78 L88,15 C88,90 44,132 0,158 C-44,132 -88,90 -88,15 L-88,-78 Z"
          fill="none" stroke="#3fd0c9" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- inner seal circle -->
    <circle cx="0" cy="-10" r="55" fill="url(#card)" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="0" cy="-10" r="40" fill="none" stroke="#3fd0c9" stroke-width="1" stroke-opacity="0.6"/>
    <!-- checkmark -->
    <path d="M-22,-10 L-6,8 L28,-32" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ribbon tails -->
    <path d="M-38,150 L-16,110 L-58,110 Z" fill="url(#ribbon)"/>
    <path d="M38,150 L16,110 L58,110 Z" fill="url(#ribbon)"/>
  </g>

  <!-- scattered small lock glyphs -->
  <g fill="none" stroke="#3fd0c9" stroke-opacity="0.35" stroke-width="2">
    <g transform="translate(1050,70)">
      <rect x="-10" y="-2" width="20" height="16" rx="2"/>
      <path d="M-6,-2 v-6 a6,6 0 0 1 12,0 v6"/>
    </g>
    <g transform="translate(1105,240)">
      <rect x="-8" y="-2" width="16" height="13" rx="2"/>
      <path d="M-5,-2 v-5 a5,5 0 0 1 10,0 v5"/>
    </g>
    <g transform="translate(1000,300)">
      <rect x="-7" y="-1" width="14" height="11" rx="2"/>
      <path d="M-4,-1 v-4 a4,4 0 0 1 8,0 v4"/>
    </g>
  </g>

  <!-- thin certificate outline drifting behind text for texture -->
  <g transform="translate(60,250)" opacity="0.12">
    <rect x="0" y="0" width="180" height="60" rx="4" fill="none" stroke="#c9962f" stroke-width="2"/>
    <line x1="15" y1="15" x2="120" y2="15" stroke="#c9962f" stroke-width="2"/>
    <line x1="15" y1="28" x2="150" y2="28" stroke="#c9962f" stroke-width="2"/>
    <circle cx="150" cy="42" r="10" fill="none" stroke="#c9962f" stroke-width="2"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#f4f7f9">
    <tspan x="60" y="150" textLength="700" lengthAdjust="spacingAndGlyphs">Certificate Manager</tspan>
    <tspan x="60" y="222" textLength="220" lengthAdjust="spacingAndGlyphs" fill="url(#gold)">GUI</tspan>
  </text>

  <!-- tagline -->
  <text x="62" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fc4d4" textLength="700" lengthAdjust="spacingAndGlyphs">
    Manages Windows certificates with a small, no-nonsense GUI
  </text>

  <!-- accent underline -->
  <rect x="62" y="284" width="140" height="4" rx="2" fill="url(#gold)"/>
</svg>